<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navidrome NX Remote</title>
<link rel="stylesheet" href="/style.css">
<main>
  <header><p class="eyebrow">NAVIDROME NX</p><h1 id="heading">Switch remote</h1></header>
  <form id="pair"><label id="pair-label" for="code">Pairing code from Switch settings</label><input id="code" autocomplete="off" spellcheck="false" maxlength="32" required><button id="connect">Connect</button></form>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="remote" hidden>
    <article><p id="play-state" class="eyebrow"></p><h2 id="title"></h2><p id="artist"></p><p id="time"></p></article>
    <nav class="transport" aria-label="Playback"><button id="previous" data-action="previous">Previous</button><button id="toggle" data-action="toggle">Play / Pause</button><button id="next" data-action="next">Next</button><button id="stop" data-action="stop">Stop</button></nav>
    <form id="search"><label id="search-label" for="query">Find a song</label><div class="row"><input id="query" maxlength="128" type="search"><button id="find">Search</button></div></form>
    <div class="row"><button id="favorites" data-action="favorites">Favorites</button><button id="shuffle" data-action="shuffle">Shuffle all favorites</button></div>
    <h2 id="view"></h2><ul id="songs"></ul><button id="disconnect">Disconnect</button>
  </section>
</main>
<script src="/app.js"></script>
</html>
